<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>HANDS 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="admin-style.css">
</head>
<body>
<div id="boot" class="boot"><div class="spinner"></div></div>

<!-- 로그인 -->
<section id="login" class="login" hidden>
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark lg" aria-hidden="true"></span>
      <div>
        <div class="login-title">HANDS 관리자</div>
        <div class="login-sub">외국인 근로자 관리 시스템</div>
      </div>
    </div>
    <div id="loginNotice" class="notice" hidden></div>

    <form id="loginForm" class="login-form" autocomplete="on" novalidate>
      <label class="field">
        <span class="field-label">아이디</span>
        <input id="loginId" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="field-label">비밀번호</span>
        <input id="loginPw" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary btn-block" id="btnLogin" type="submit">로그인</button>
    </form>

    <div id="loginError" class="form-error" role="alert" hidden></div>
    <div class="login-foot">
      <span class="ico sm" data-i="lock"></span>
      관리자 전용 시스템입니다. 모든 열람·수정 기록이 저장되며, 30분 동안 사용하지 않으면 자동으로 로그아웃됩니다.
    </div>
  </div>
</section>

<!-- 관리 화면 -->
<div id="app" class="shell" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="side-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div><div class="side-name">HANDS</div><div class="side-sub">관리자 콘솔</div></div>
      <button class="icon-btn side-close" id="btnDrawerClose" aria-label="메뉴 닫기"><span class="ico" data-i="x"></span></button>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-group">현황</div>
      <a href="#/dashboard" data-view="dashboard"><span class="ico" data-i="grid"></span>대시보드</a>
      <a href="#/qr" data-view="qr"><span class="ico" data-i="qr"></span>가입 QR</a>
      <a href="#/sos" data-view="sos"><span class="ico" data-i="alert"></span>SOS<span class="nav-badge" id="sosBadge" hidden></span></a>
      <a href="#/map" data-view="map"><span class="ico" data-i="map"></span>지도</a>
      <div class="nav-group">관리</div>
      <a href="#/members" data-view="members"><span class="ico" data-i="users"></span>근로자</a>
      <a href="#/silent" data-view="silent"><span class="ico" data-i="clock"></span>미접속</a>
      <a href="#/posts" data-view="posts"><span class="ico" data-i="message"></span>게시판</a>
      <div class="nav-group">보안</div>
      <a href="#/logs" data-view="logs"><span class="ico" data-i="file"></span>열람 기록</a>
    </nav>
    <div class="side-foot">
      <div class="side-session"><span class="ico sm" data-i="shield"></span><span>자동 로그아웃까지 <b id="idleLeft" class="num">30:00</b></span></div>
      <div class="side-ver">HANDS Admin · v2.0</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btnMenu" aria-label="메뉴 열기"><span class="ico" data-i="menu"></span></button>
      <div class="top-title">
        <h1 id="pageTitle">대시보드</h1>
        <div class="top-sub" id="pageSub"></div>
      </div>
      <a class="top-sos" id="topSos" href="#/sos" hidden><span class="dot-pulse"></span>SOS <b class="num" id="topSosN">0</b></a>
      <div class="top-right">
        <span class="updated muted" id="updatedAt"></span>
        <div class="admin-chip" title="로그인한 관리자">
          <span class="avatar" id="adminAvatar">A</span>
          <span class="admin-text"><span id="adminName" class="admin-name"></span><span id="adminEmail" class="admin-email"></span></span>
        </div>
        <button class="btn btn-ghost btn-sm" id="btnLogout"><span class="ico sm" data-i="logout"></span><span class="hide-sm">로그아웃</span></button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <!-- 휴대폰 하단 탭 -->
  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴">
    <a href="#/dashboard" data-tab="dashboard"><span class="ico" data-i="grid"></span><span>홈</span></a>
    <a href="#/sos" data-tab="sos"><span class="tab-ico"><span class="ico" data-i="alert"></span><b class="tab-badge" id="tabSosBadge" hidden></b></span><span>SOS</span></a>
    <a href="#/members" data-tab="members"><span class="ico" data-i="users"></span><span>근로자</span></a>
    <a href="#/map" data-tab="map"><span class="ico" data-i="map"></span><span>지도</span></a>
    <button type="button" id="tabMore" data-tab="more"><span class="ico" data-i="menu"></span><span>더보기</span></button>
  </nav>
  <div class="sheet-back" id="moreBack" hidden></div>
  <div class="sheet" id="moreSheet" hidden role="dialog" aria-label="더보기">
    <div class="sheet-grip" aria-hidden="true"></div>
    <a href="#/qr"><span class="ico" data-i="qr"></span>가입 QR</a>
    <a href="#/silent"><span class="ico" data-i="clock"></span>미접속</a>
    <a href="#/posts"><span class="ico" data-i="message"></span>게시판</a>
    <a href="#/logs"><span class="ico" data-i="file"></span>열람 기록</a>
    <div class="sheet-foot">
      <div class="sheet-who"><span id="moreEmail"></span><span class="muted">자동 로그아웃까지 <b class="num" id="moreIdle">30:00</b></span></div>
      <button type="button" class="btn btn-secondary" id="moreLogout"><span class="ico sm" data-i="logout"></span>로그아웃</button>
    </div>
  </div>

  <!-- 근로자 상세 패널 -->
  <div class="panel-scrim" id="panelScrim" hidden></div>
  <aside class="panel" id="panel" aria-hidden="true" role="dialog" aria-label="근로자 상세"></aside>
</div>

<div id="modalRoot"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="admin-app.js"></script>
</body>
</html>
